name: Hydrology data pipeline

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hydro-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/hydro/requirements.txt
      - name: Fetch TATUS layers
        continue-on-error: true
        run: python tools/hydro/fetch_tatus.py
      - name: Build river reach mapping
        continue-on-error: true
        run: python tools/hydro/build_river_reach_map.py
      - name: Fetch GEOGLOWS
        continue-on-error: true
        run: python tools/hydro/fetch_geoglows.py
      - name: Fetch EPİAŞ
        continue-on-error: true
        run: python tools/hydro/fetch_epias.py
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
          EPIAS_TGT_URL: ${{ secrets.EPIAS_TGT_URL }}
          EPIAS_DAM_ENDPOINT: ${{ secrets.EPIAS_DAM_ENDPOINT }}
      - name: Build, audit and validate canonical package
        run: |
          python tools/build_hes177.py
          python tools/hydro/build_reservoirs.py
          python tools/hydro/audit_fullness_sources.py
          python tools/validate_hes177.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
