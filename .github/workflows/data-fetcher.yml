name: Hydrology data pipeline

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  tatus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/hydro/requirements.txt
      - run: python tools/hydro/fetch_tatus.py
      - run: python tools/hydro/build_river_reach_map.py
      - uses: actions/upload-artifact@v4
        with:
          name: tatus-hydrology-data
          path: |
            public/data/static/tatus
            public/data/static/mappings
            public/data/manifest

  geoglows:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *' }}
    needs: tatus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tatus-hydrology-data
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/hydro/requirements.txt
      - run: python tools/hydro/fetch_geoglows.py
      - uses: actions/upload-artifact@v4
        with:
          name: geoglows-live-data
          path: public/data/live/geoglows_latest.json

  epias:
    needs: tatus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/hydro/requirements.txt
      - run: python tools/hydro/fetch_epias.py
        env:
          EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
          EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
          EPIAS_TGT_URL: ${{ secrets.EPIAS_TGT_URL }}
          EPIAS_DAM_ENDPOINT: ${{ secrets.EPIAS_DAM_ENDPOINT }}
      - uses: actions/upload-artifact@v4
        with:
          name: epias-live-data
          path: |
            public/data/live/epias_dams_latest.json
            public/data/live/epias_dams_history.json
